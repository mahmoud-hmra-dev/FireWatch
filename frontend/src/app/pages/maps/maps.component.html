<section class="page-header">
  <div>
    <h2>{{ 'maps.title' | translate }}</h2>
    <p>{{ 'maps.subtitle' | translate }}</p>
  </div>
</section>

<div class="map-panel">
  <iframe [src]="mapUrl" [title]="'common.mapTitle' | translate"></iframe>
</div>

<div class="area-grid">
  <div class="area-card" *ngFor="let area of areas">
    <div>
      <strong>{{ area.name }}</strong>
      <p>{{ 'maps.pointsMapped' | translate:{ count: area.coordinates.length } }}</p>
    </div>
    <span [class]="riskClass(area.risk_level)">{{ ('risk.' + area.risk_level) | translate }}</span>
  </div>
</div>
