<section class="auth-card">
  <div class="auth-header">
    <h2>{{ 'auth.register.title' | translate }}</h2>
    <p>{{ 'auth.register.subtitle' | translate }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label>
      {{ 'auth.name.label' | translate }}
      <input type="text" formControlName="name" [placeholder]="'auth.name.placeholder' | translate" />
    </label>
    <label>
      {{ 'auth.email.label' | translate }}
      <input type="email" formControlName="email" [placeholder]="'auth.email.placeholder' | translate" />
    </label>
    <label>
      {{ 'auth.password.label' | translate }}
      <input type="password" formControlName="password" [placeholder]="'auth.password.placeholder' | translate" />
    </label>
    <label>
      {{ 'auth.passwordConfirm.label' | translate }}
      <input
        type="password"
        formControlName="password_confirmation"
        [placeholder]="'auth.passwordConfirm.placeholder' | translate"
      />
    </label>

    <button class="btn primary" type="submit" [disabled]="loading">
      {{ loading ? ('auth.register.loading' | translate) : ('auth.register.submit' | translate) }}
    </button>
    <p class="error" *ngIf="errorKey">{{ errorKey | translate }}</p>
  </form>

  <p class="switch">
    {{ 'auth.register.switchPrompt' | translate }} <a routerLink="/login">{{ 'auth.register.switchLink' | translate }}</a>
  </p>
</section>
