<section class="auth-card">
  <div class="auth-header">
    <h2>{{ 'auth.login.title' | translate }}</h2>
    <p>{{ 'auth.login.subtitle' | translate }}</p>
    <span class="hint" *ngIf="roleHintKey">{{ roleHintKey | translate }}</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label>
      {{ 'auth.email.label' | translate }}
      <input type="email" formControlName="email" [placeholder]="'auth.email.placeholder' | translate" />
    </label>
    <label>
      {{ 'auth.password.label' | translate }}
      <input type="password" formControlName="password" placeholder="********" />
    </label>

    <button class="btn primary" type="submit" [disabled]="loading">
      {{ loading ? ('auth.login.loading' | translate) : ('auth.login.submit' | translate) }}
    </button>
    <p class="error" *ngIf="errorKey">{{ errorKey | translate }}</p>
  </form>

  <p class="switch">
    {{ 'auth.login.switchPrompt' | translate }} <a routerLink="/register">{{ 'auth.login.switchLink' | translate }}</a>
  </p>
</section>
