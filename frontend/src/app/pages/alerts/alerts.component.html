<section class="page-header">
  <div>
    <h2>{{ 'alerts.page.title' | translate }}</h2>
    <p>{{ 'alerts.page.subtitle' | translate }}</p>
  </div>
</section>

<div class="filters" [formGroup]="filterForm">
  <select formControlName="area_id">
    <option value="">{{ 'filters.allAreas' | translate }}</option>
    <option *ngFor="let alert of alerts" [value]="alert.area?.id">
      {{ alert.area?.name || ('alerts.unassigned' | translate) }}
    </option>
  </select>
  <select formControlName="risk">
    <option value="">{{ 'filters.allRiskLevels' | translate }}</option>
    <option value="low">{{ 'risk.low' | translate }}</option>
    <option value="medium">{{ 'risk.medium' | translate }}</option>
    <option value="high">{{ 'risk.high' | translate }}</option>
  </select>
  <select formControlName="time">
    <option value="all">{{ 'filters.allTime' | translate }}</option>
    <option value="24h">{{ 'filters.last24h' | translate }}</option>
    <option value="7d">{{ 'filters.last7d' | translate }}</option>
  </select>
</div>

<div class="alert-list">
  <div class="alert-card" *ngFor="let alert of filteredAlerts">
    <div>
      <strong>{{ alert.area?.name || ('alerts.page.unknownArea' | translate) }}</strong>
      <p>{{ alert.description || ('alerts.page.autoDescription' | translate) }}</p>
    </div>
    <div class="meta">
      <span>{{ riskLabel(alert.area?.risk_level) }}</span>
      <span>{{ alert.created_at | date:'short' }}</span>
    </div>
  </div>
</div>
