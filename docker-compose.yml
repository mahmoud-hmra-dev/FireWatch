services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: firewatch
      MYSQL_USER: firewatch
      MYSQL_PASSWORD: firewatch
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3333:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    restart: unless-stopped
    ports:
      - "7777:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: firewatch
      PMA_PASSWORD: firewatch
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "7788:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: firewatch
      DB_USERNAME: firewatch
      DB_PASSWORD: firewatch
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - backend-storage:/var/www/html/storage
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  backend-storage:
  mysql-data:
